name: build

on:
  push:
    branches: [ main, 'feature/**' ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore PerformanceChecker.csproj
      - name: Build
        run: dotnet build PerformanceChecker.csproj -c Release --no-restore
      - name: Publish portable win-x64
        run: dotnet publish PerformanceChecker.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o package
      - name: Add distribution files
        shell: pwsh
        run: |
          Copy-Item install.ps1 package/install.ps1
          Copy-Item uninstall.ps1 package/uninstall.ps1
          Copy-Item README.md package/README.md
      - name: Package ZIP
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath Performance-Checker-For-Win-win-x64.zip -Force
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash Performance-Checker-For-Win-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Performance-Checker-For-Win-win-x64.zip" | Set-Content SHA256SUMS.txt -Encoding ascii
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Performance-Checker-For-Win-win-x64
          path: |
            Performance-Checker-For-Win-win-x64.zip
            SHA256SUMS.txt
      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $title = "Performance-Checker-For-Win $tag"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              Performance-Checker-For-Win-win-x64.zip `
              SHA256SUMS.txt `
              --title $title `
              --generate-notes
          } else {
            gh release upload $tag `
              Performance-Checker-For-Win-win-x64.zip `
              SHA256SUMS.txt `
              --clobber
          }

# main / feature pushes run CI and upload an artifact.
# v* tags additionally publish the ZIP as a GitHub Release.
# If the Release already exists (for example, when created manually),
# the ZIP and checksum are uploaded to the existing Release instead.
